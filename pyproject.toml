[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mf-sync"
version = "0.1.0"
description = "Read-only FastAPI summary service for mf-dashboard SQLite data"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "google-cloud-storage>=2.19,<4",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]
security = [
  "bandit[toml]==1.9.4",
  "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
