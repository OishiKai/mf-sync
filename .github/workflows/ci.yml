name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python security and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes --requirement requirements-test.lock

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Static security analysis
        run: bandit --quiet --recursive app

      - name: Audit runtime dependencies
        run: pip-audit --require-hashes --requirement requirements.lock

  container:
    name: Container build and health
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image
        run: docker build --tag mf-sync:ci .

      - name: Verify health endpoint
        run: |
          docker run --detach --name mf-sync-ci --publish 8080:8080 mf-sync:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs mf-sync-ci
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm --force mf-sync-ci || true

  terraform:
    name: Terraform validation and policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check infrastructure policy
        uses: bridgecrewio/checkov-action@1246d92f57abae29d5db5f9aeeed2a9813e52d7d # master
        with:
          directory: infra
          framework: terraform
          quiet: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize without backend
        run: terraform -chdir=infra init -backend=false

      - name: Validate
        run: terraform -chdir=infra validate

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
